<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>giatrash.gr</title>
    <meta name="description" content="giatrash.gr - Ψηφιακές δημιουργίες και τεχνική ανάλυση.">
    <meta name="keywords" content="giatrash, Lab, Engineering, IT, ψηφιακές δημιουργίες, gh">
    <meta name="author" content="gh">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #000; }
        
        .bg { 
            background: url('bg-sea.png') no-repeat center center fixed; 
            background-size: cover; 
            height: 100vh; 
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 15vh;
        }

        /* Container Αντικατοπτρισμού */
        .reflection-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-text {
            color: rgba(255, 255, 255, 0.9);
            font-weight: 100;
            letter-spacing: 10px;
            font-size: 1.6rem;
            text-transform: lowercase;
            margin-bottom: 2px;
        }

        .mirror-text {
            color: rgba(255, 255, 255, 0.15);
            font-weight: 100;
            letter-spacing: 10px;
            font-size: 1.6rem;
            text-transform: lowercase;
            transform: scaleY(-1);
            filter: blur(3px);
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1), rgba(0,0,0,0));
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1), rgba(0,0,0,0));
        }

        @media (max-width: 600px) {
            .main-text, .mirror-text { font-size: 1.1rem; letter-spacing: 5px; }
            .bg { padding-top: 12vh; }
        }

        /* gh - Στρατηγική κάλυψη Watermark */
        .lifesaver-btn { 
            position: fixed; 
            bottom: 0px; 
            right: 0px; 
            width: 100px; 
            height: 100px; 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255,255,255,0.2); 
            border-radius: 50% 0 0 0; 
            color: rgba(255,255,255,0.5); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            cursor: pointer; 
            backdrop-filter: blur(15px); 
            font-weight: 200; 
            font-size: 20px; 
            z-index: 9999;
            transition: 0.5s;
        }
        .lifesaver-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }

        .modal { display: none; position: fixed; bottom: 110px; right: 20px; background: rgba(255,255,255,0.98); padding: 25px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); z-index: 10000; width: 250px; text-align: center; }
        .modal a { display: block; padding: 15px; margin: 10px 0; text-decoration: none; color: #000; border-radius: 12px; background: #f5f5f5; font-size: 14px; }
    </style>
</head>
<body>

    <div class="bg">
        <div class="reflection-container">
            <div class="main-text">ψηφιακές δημιουργίες</div>
            <div class="mirror-text">ψηφιακές δημιουργίες</div>
        </div>
    </div>

    <div class="lifesaver-btn" onclick="toggleModal()">gh</div>

    <div id="contactModal" class="modal">
        <div style="font-size:10px; letter-spacing:3px; margin-bottom:15px; color:#888; text-align:center;">ΕΠΙΚΟΙΝΩΝΙΑ</div>
        <a href="mailto:giatrash@gmail.com">giatrash@gmail.com</a>
        <a href="#" onclick="toggleModal()" style="background:none; color:#bbb; font-size:10px; display:block; margin-top:10px;">κλείσιμο</a>
    </div>

    <script>
        function toggleModal() {
            var m = document.getElementById('contactModal');
            m.style.display = (m.style.display === 'block') ? 'none' : 'block';
        }
    </script>

</body>
</html>
