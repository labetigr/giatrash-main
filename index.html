<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>giatrash.gr | Ψηφιακές Δημιουργίες</title>
    <meta name="description" content="giatrash.gr - Επίσημος ψηφιακός κόμβος για Engineering, IT, Γεωπονία, Ναυσιπλοΐα και Φιλοσοφία.">
    <meta name="keywords" content="giatrash, ψηφιακές δημιουργίες, Lab, Engineering, IT, Γεωπονία, Ναυσιπλοΐα, Ηλεκτρονικά, Οικονομία, Φιλοσοφία">
    <meta name="author" content="gh">
    
    <meta property="og:title" content="giatrash.gr | Ψηφιακές Δημιουργίες">
    <meta property="og:description" content="Εξερευνήστε τον ψηφιακό κόσμο του giatrash.gr.">
    <meta property="og:image" content="bg-sea.png">
    <meta property="og:url" content="https://giatrash.gr">

    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #000; }
        
        .bg { 
            background: url('bg-sea.png') no-repeat center center fixed; 
            background-size: cover; 
            height: 100%; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; /* Τίτλος στον ουρανό */
        }
        
        h1 { 
            color: rgba(255, 255, 255, 0.85); 
            font-weight: 100; 
            letter-spacing: 8px; 
            text-shadow: 1px 1px 10px rgba(0,0,0,0.3); 
            font-size: 1.6rem; 
            text-align: center; 
            padding-top: 12vh; 
            margin: 0;
            text-transform: lowercase;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.1rem; letter-spacing: 4px; padding-top: 15vh; }
        }
        
        .lifesaver-btn { 
            position: fixed; 
            bottom: 0px; 
            right: 0px; 
            width: 85px; 
            height: 85px; 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(255,255,255,0.2); 
            border-radius: 50%; 
            color: rgba(255,255,255,0.6); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            cursor: pointer; 
            backdrop-filter: blur(15px); 
            font-weight: 200; 
            font-size: 20px; 
            z-index: 100;
            text-transform: lowercase;
            transition: 0.5s;
        }

        .modal { display: none; position: fixed; bottom: 95px; right: 10px; background: rgba(255,255,255,0.95); padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); z-index: 101; width: 260px; backdrop-filter: blur(10px); }
        .modal a { display: block; padding: 15px; margin: 10px 0; text-decoration: none; color: #000; border-radius: 12px; background: rgba(0,0,0,0.05); text-align: center; font-size: 14px; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="bg">
        <h1>ψηφιακές δημιουργίες</h1>
    </div>

    <div class="lifesaver-btn" onclick="toggleModal()">gh</div>

    <div id="contactModal" class="modal">
        <div style="text-align:center; font-size:12px; margin-bottom:15px; letter-spacing:2px; font-weight:300;">ΕΠΙΚΟΙΝΩΝΙΑ</div>
        <a href="mailto:giatrash@gmail.com">giatrash@gmail.com</a>
        <a href="#" onclick="toggleModal()" style="background:none; color:#999; font-size:11px;">κλείσιμο</a>
    </div>

    <script>
        function toggleModal() {
            var m = document.getElementById('contactModal');
            m.style.display = (m.style.display === 'block') ? 'none' : 'block';
        }
    </script>

</body>
</html>
