<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>giatrash.gr</title>
    <style>
        /* Base Setup */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #000; }
        
        .bg { 
            background: url('bg-sea.png') no-repeat center center fixed; 
            background-size: cover; 
            height: 100vh; 
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 15vh;
        }

        /* Container Αντικατοπτρισμού */
        .reflection-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-text {
            color: rgba(255, 255, 255, 0.9);
            font-weight: 100;
            letter-spacing: 10px; /* Breathe space */
            font-size: 1.6rem;
            text-transform: lowercase;
            margin-bottom: 2px;
        }

        /* Το είδωλο - Φυσικός Αντικατοπτρισμός */
        .mirror-text {
            color: rgba(255, 255, 255, 0.15); /* Πολύ αχνό */
            font-weight: 100;
            letter-spacing: 10px;
            font-size: 1.6rem;
            text-transform: lowercase;
            transform: scaleY(-1); /* Flipped vertically */
            filter: blur(3px); /* Θόλωμα νερού */
            
            /* Σβήσιμο στο τέλος */
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1), rgba(0,0,0,0));
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1), rgba(0,0,0,0));
        }

        @media (max-width: 600px) {
            .main-text, .mirror-text { font-size: 1.1rem; letter-spacing: 5px; }
            .bg { padding-top: 12vh; }
        }

        /* gh - Συμπαγής κάλυψη γωνίας (Bye bye Watermark) */
        .lifesaver-btn { 
            position: fixed; 
            bottom: 0px; 
            right: 0px; 
            width: 110px; /* Μεγαλύτερο για να καλύπτει το αστεράκι */
            height: 110px; 
            background: #1a3c4a; /* Σταθερό χρώμα για να "πνίξει" το γράφημα */
            border: 4px double rgba(255,255,255,0.4); 
            border-radius: 50% 0 0 0; /* Σχήμα τέταρτου κύκλου στη γωνία */
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 22px; 
            z-index: 9999;
            box-shadow: 0 0 25px rgba(0,0,0,0.4);
            transition: 0.3s;
        }
        .lifesaver-btn:hover { background: #245a6f; }

        /* Modal */
        .modal { display: none; position: fixed; bottom: 120px; right: 20px; background: rgba(255,255,255,0.98); padding: 25px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); z-index: 10000; width: 260px; backdrop-filter: blur(10px); }
        .modal a { display: block; padding: 15px; margin: 10px 0; text-decoration: none; color: #000; border-radius: 12px; background: rgba(0,0,0,0.05); text-align: center; font-size: 14px; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="bg">
        <div class="reflection-container">
            <div class="main-text">ψηφιακές δημιουργίες</div>
            <div class="mirror-text">ψηφιακές δημιουργίες</div>
        </div>
    </div>

    <div class="lifesaver-btn" onclick="toggleModal()">gh</div>

    <div id="contactModal" class="modal">
        <div style="font-size:10px; letter-spacing:3px; margin-bottom:15px; text-align:center; color:#888;">ΕΠΙΚΟΙΝΩΝΙΑ</div>
        <a href="mailto:giatrash@gmail.com">giatrash@gmail.com</a>
        <a href="#" onclick="toggleModal()" style="background:none; color:#bbb; font-size:10px;">κλείσιμο</a>
    </div>

    <script>
        function toggleModal() {
            var m = document.getElementById('contactModal');
            m.style.display = (m.style.display === 'block') ? 'none' : 'block';
        }
    </script>

</body>
</html>
