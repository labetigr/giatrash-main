<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>giatrash.gr</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #000; }
        
        .bg { 
            background: url('bg-sea.png') no-repeat center center fixed; 
            background-size: cover; 
            height: 100vh; 
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 15vh;
        }

        /* Container για τον Αντικατοπτρισμό */
        .reflection-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Κύριο Κείμενο */
        .main-text {
            color: rgba(255, 255, 255, 0.9);
            font-weight: 100;
            letter-spacing: 8px;
            font-size: 1.6rem;
            text-transform: lowercase;
            margin-bottom: 5px;
        }

        /* Το Είδωλο (Αντικατοπτρισμός) */
        .mirror-text {
            color: rgba(255, 255, 255, 0.2); /* Πολύ πιο αχνό */
            font-weight: 100;
            letter-spacing: 8px;
            font-size: 1.6rem;
            text-transform: lowercase;
            transform: scaleY(-1); /* Αντιστροφή */
            filter: blur(2px); /* Θόλωμα νερού */
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1), rgba(0,0,0,0)); /* Σβήσιμο στο τέλος */
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1), rgba(0,0,0,0));
        }

        @media (max-width: 600px) {
            .main-text, .mirror-text { font-size: 1.1rem; letter-spacing: 4px; }
        }

        /* gh Lifesaver - Solid coverage */
        .lifesaver-btn { 
            position: fixed; 
            bottom: -10px; right: -10px; 
            width: 100px; height: 100px; 
            background: #1a3a4a; 
            border: 3px double rgba(255,255,255,0.4); 
            border-radius: 50%; 
            color: white; 
            display: flex; justify-content: center; align-items: center; 
            cursor: pointer; font-weight: bold; font-size: 18px; z-index: 9999;
        }

        .modal { display: none; position: fixed; bottom: 100px; right: 20px; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); z-index: 10000; width: 260px; }
        .modal a { display: block; padding: 15px; margin: 10px 0; text-decoration: none; color: #000; border-radius: 12px; background: #f0f0f0; text-align: center; font-size: 14px; }
    </style>
</head>
<body>

    <div class="bg">
        <div class="reflection-container">
            <div class="main-text">ψηφιακές δημιουργίες</div>
            <div class="mirror-text">ψηφιακές δημιουργίες</div>
        </div>
    </div>

    <div class="lifesaver-btn" onclick="toggleModal()">gh</div>

    <div id="contactModal" class="modal">
        <div style="font-size:10px; letter-spacing:3px; margin-bottom:15px; text-align:center; color:#888;">ΕΠΙΚΟΙΝΩΝΙΑ</div>
        <a href="mailto:giatrash@gmail.com">giatrash@gmail.com</a>
        <a href="#" onclick="toggleModal()" style="background:none; color:#bbb; font-size:10px;">κλείσιμο</a>
    </div>

    <script>
        function toggleModal() {
            var m = document.getElementById('contactModal');
            m.style.display = (m.style.display === 'block') ? 'none' : 'block';
        }
    </script>

</body>
</html>
