<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #000; }
        
        .bg { 
            background: url('bg-sea.png') no-repeat center center fixed; 
            background-size: cover; 
            height: 100vh; 
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 15vh;
        }

        .reflection-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-text {
            color: rgba(255, 255, 255, 0.9);
            font-weight: 100;
            letter-spacing: 8px;
            font-size: 1.6rem;
            text-transform: lowercase;
            margin-bottom: 2px;
        }

        .mirror-text {
            color: rgba(255, 255, 255, 0.2);
            font-weight: 100;
            letter-spacing: 8px;
            font-size: 1.6rem;
            text-transform: lowercase;
            transform: scaleY(-1);
            filter: blur(2px);
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1), rgba(0,0,0,0));
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1), rgba(0,0,0,0));
        }

        @media (max-width: 600px) {
            .main-text, .mirror-text { font-size: 1.1rem; letter-spacing: 4px; }
            .bg { padding-top: 12vh; }
        }

        /* gh - Θέση στη γωνία για κάλυψη watermark */
        .lifesaver-btn { 
            position: fixed; 
            bottom: 5px; 
            right: 5px; 
            width: 85px; 
            height: 85px; 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255,255,255,0.3); 
            border-radius: 50%; 
            color: rgba(255,255,255,0.7); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            cursor: pointer; 
            backdrop-filter: blur(15px); 
            font-weight: 200; 
            font-size: 18px; 
            z-index: 9999;
            transition: 0.3s;
        }

        /* Modal Popup */
        .modal { display: none; position: fixed; bottom: 100px; right: 15px; background: rgba(255,255,255,0.98); padding: 25px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); z-index: 10000; width: 280px; text-align: center; }
        .modal span { display: block; font-size: 10px; letter-spacing: 2px; color: #888; margin-bottom: 15px; }
        .modal a { display: block; padding: 12px; margin: 8px 0; text-decoration: none; color: #000; border-radius: 10px; background: #f5f5f5; font-size: 13px; font-weight: 400; }
    </style>
</head>

        </div>
    </div>

    <div class="lifesaver-btn" onclick="toggleModal()">gh</div>

    <div id="contactModal" class="modal">

        <div style="font-size: 12px; margin-bottom: 15px; line-height: 1.4; color: #444;">
            Εξειδικευμένο Prompting AI<br>
            Advanced Prompt Engineering
        </div>
        <a href="mailto:giatrash@gmail.com">📧 giatrash@gmail.com</a>
        <a href="#" onclick="toggleModal()" style="background:none; color:#bbb; font-size:10px;">κλείσιμο</a>
    </div>

    <script>
        function toggleModal() {
            var m = document.getElementById('contactModal');
            m.style.display = (m.style.display === 'block') ? 'none' : 'block';
        }
    </script>

</body>
</html>
